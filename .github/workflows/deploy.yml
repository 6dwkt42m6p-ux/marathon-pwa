name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # T-171: vitest lief bisher NIE in der CI — alle src/**/*.test.ts waren reine
      # Lokal-Tests, und das Cross-Plattform-Parity-Gate waere damit dekorativ gewesen
      # (dieselbe Klasse Scheingate wie T-178: meldet gruen, prueft nichts). Laeuft VOR
      # dem Build, damit ein Deploy bei roten Tests gar nicht erst gebaut wird.
      - name: Tests
        run: npm test

      - name: Build
        env:
          VITE_STRAVA_CLIENT_ID: ${{ secrets.VITE_STRAVA_CLIENT_ID }}
          VITE_STRAVA_TOKEN_PROXY: ${{ secrets.VITE_STRAVA_TOKEN_PROXY }}
          VITE_STRAVA_REDIRECT_URI: ${{ secrets.VITE_STRAVA_REDIRECT_URI }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
